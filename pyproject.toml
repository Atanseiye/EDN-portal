[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ednai"
version = "0.1.0"
description = "Developer infrastructure for Nigeria's N-ATLaS model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Energy Data Network"}]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13.8,<15"
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "gradio-client>=1.8,<2"
]
local = [
  "transformers>=4.57,<6",
  "torch>=2.4",
  "accelerate>=1.1",
  "huggingface-hub>=0.27"
]
train = [
  "transformers>=4.57,<6",
  "torch>=2.4",
  "accelerate>=1.1",
  "huggingface-hub>=0.27",
  "datasets>=3.1",
  "peft>=0.17",
  "trl>=0.20",
  "bitsandbytes>=0.45",
  "pyyaml>=6.0"
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "gradio-client>=1.8,<2"
]

[project.scripts]
ednai = "ednai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ednai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
