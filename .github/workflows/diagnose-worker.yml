name: Diagnose EDNAi Worker
on:
  workflow_dispatch:
  push:
    branches: [ednai]
    paths: ['.github/workflows/diagnose-worker.yml', 'scripts/diagnose_worker.py']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: deploy/cloudflare
      - name: Capture live runtime error
        working-directory: deploy/cloudflare
        run: python ../../scripts/diagnose_worker.py
